<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPS — Sidebar Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="mobile-menu" aria-label="Sidebar menu">
    <div class="mobile-menu__top">
      <header class="mobile-menu__header">
        <button class="icon-btn mobile-menu__close" type="button" aria-label="Close menu">
          <img src="img/close.svg" alt="Close" width="40" height="40">
        </button>
        <a class="mobile-menu__logo" href="#" aria-label="CPS Home">
          <img src="img/logo.svg" alt="CPS Logo" width="97" height="51">
        </a>
        <button class="icon-btn mobile-menu__search" type="button" aria-label="Search">
          <img src="img/search.svg" alt="Search" width="40" height="40">
        </button>
      </header>

      <nav class="mobile-menu__nav" aria-label="Main navigation">
        <ul class="mobile-menu__list">
          <li class="mobile-menu__item">
            <a class="mobile-menu__link mobile-menu__link--active" href="#">Equipment repair</a>
          </li>
          <li class="mobile-menu__item">
            <a class="mobile-menu__link" href="#">Services and solutions</a>
          </li>
          <li class="mobile-menu__item">
            <a class="mobile-menu__link" href="#">Corporate clients</a>
          </li>
          <li class="mobile-menu__item">
            <a class="mobile-menu__link" href="#">Equipment sellers</a>
          </li>
          <li class="mobile-menu__item">
            <a class="mobile-menu__link" href="#">Partners</a>
          </li>
          <li class="mobile-menu__item">
            <a class="mobile-menu__link" href="#">Manufacturers</a>
          </li>
          <li class="mobile-menu__item">
            <a class="mobile-menu__link" href="#">Our service centres</a>
          </li>
          <li class="mobile-menu__item">
            <a class="mobile-menu__link" href="#">Contacts</a>
          </li>
        </ul>
      </nav>
    </div>

    <footer class="mobile-menu__footer">
      <div class="mobile-menu__actions">
        <button class="icon-btn" type="button" aria-label="Call">
          <img src="img/call.svg" alt="Call" width="40" height="40">
        </button>
        <button class="icon-btn" type="button" aria-label="Chat">
          <img src="img/chat.svg" alt="Chat" width="40" height="40">
        </button>
        <button class="icon-btn" type="button" aria-label="Profile">
          <img src="img/profile.svg" alt="Profile" width="40" height="40">
        </button>
      </div>

      <address class="mobile-menu__contacts">
        <a class="mobile-menu__mail" href="mailto:mail@cps.com">mail@cps.com</a>
        <a class="mobile-menu__phone" href="tel:88008908900">8 800 890 8900</a>
      </address>

      <div class="mobile-menu__lang" role="group" aria-label="Language switcher">
        <button class="mobile-menu__lang-btn mobile-menu__lang-btn--active" type="button">RU</button>
        <button class="mobile-menu__lang-btn" type="button">EN</button>
        <button class="mobile-menu__lang-btn" type="button">CH</button>
      </div>
    </footer>
  </aside>
</body>
</html>
